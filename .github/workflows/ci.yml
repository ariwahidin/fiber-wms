
name: Fiber WMS CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test Go and Build Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        shell: bash
        run: |
          files=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$files" ]; then
            echo "Go files need formatting:"
            echo "$files"
            exit 1
          fi

      - name: Run Go tests
        run: go test ./...

      - name: Build Go application
        run: go build -o app .

      - name: Build Docker image
        run: docker build -t fiber-wms:${{ github.sha }} .
