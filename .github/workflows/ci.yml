
name: Fiber WMS CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test Go and Build Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        shell: bash
        run: |
          files=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$files" ]; then
            echo "Go files need formatting:"
            echo "$files"
            exit 1
          fi

      - name: Run Go tests
        run: go test ./...

      - name: Build Go application
        run: go build -o app .

      - name: Build Docker image
        run: docker build -t fiber-wms:${{ github.sha }} .

  publish:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image name
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:dev
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}

  deploy:
    name: Deploy to Windows Development
    runs-on: [self-hosted, Windows, X64]
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'

    steps:
      - name: Validate deployment directory
        shell: powershell
        run: |
          $projectPath = 'D:\IT\Development\WMS DEV\fiber-wms'

          if (-not (Test-Path "$projectPath\docker-compose.yml")) {
            throw "docker-compose.yml not found: $projectPath"
          }

          if (-not (Test-Path "$projectPath\.env.docker.local")) {
            throw ".env.docker.local not found"
          }

          docker info
          if ($LASTEXITCODE -ne 0) {
            throw "Docker Desktop is not available"
          }

      - name: Pull and deploy exact commit image
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $projectPath = 'D:\IT\Development\WMS DEV\fiber-wms'
          Set-Location $projectPath

          $env:WMS_IMAGE_TAG = "sha-${{ github.sha }}"

          docker compose pull
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to pull image $env:WMS_IMAGE_TAG"
          }

          docker compose up -d --remove-orphans
          if ($LASTEXITCODE -ne 0) {
            throw "Docker Compose deployment failed"
          }

      - name: Verify application health
        shell: powershell
        run: |
          $healthUrl = 'http://localhost:9000/api/v1/health'
          $healthy = $false

          for ($i = 1; $i -le 30; $i++) {
            try {
              $response = Invoke-RestMethod `
                -Uri $healthUrl `
                -Method Get `
                -TimeoutSec 5

              if ($response.status -eq 'ok' -and
                  $response.services.api -eq 'ok' -and
                  $response.services.db -eq 'ok') {
                $healthy = $true
                Write-Host "WMS health check passed."
                $response | ConvertTo-Json -Depth 5
                break
              }
            }
            catch {
              Write-Host "Health check attempt $i/30 failed."
            }

            Start-Sleep -Seconds 5
          }

          if (-not $healthy) {
            docker logs --tail 100 fiber-wms-local
            throw "Deployment health check failed"
          }
